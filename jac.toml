[project]
name = "trading-agent"
version = "0.1.0"
description = "Multi-agent system that researches S&P 500 stocks and trades them on Alpaca paper accounts."
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.12"

[dependencies]
# Collectors call data sources directly (research/collector.jac).
httpx = ">=0.28,<1"

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[placement]
default = "server"

[byllm.model]
default_model = "openrouter/nvidia/nemotron-3-super-120b-a12b:free"

[byllm.call_params]
temperature = 0.2
max_output_retries = 1

[check.lint]
select = ["all"]

[scale.admin]
default_password = "${ADMIN_PASSWORD:-changeme}"

[client.app_meta_data]
title = "Trading Agent"
description = "An AI investment committee that researches S&P 500 stocks and trades on paper. An educational project; not investment advice."
icon = "/static/assets/favicon.svg"
theme_color = "#1e5b25"

[test]
directory = "."
