[project]
name = "project"
default-app = "web"
jac-version = "==0.37.12"

[apps]
[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.mobile.test]
directories = ["core/jacyac"]

[apps.mobile.dependencies]
[apps.mobile.dependencies.npm]
[apps.mobile.dependencies.npm.native]
"@noble/hashes" = "^2.0.1"
expo-web-browser = "~15.0.0"
expo-crypto = "~15.0.0"
expo-font = "~14.0.0"
lucide-react-native = "^0.469.0"
react-native-svg = "^15.13.0"




[apps.cli]
kind = "cli"
entry-point = "cli.main"

[apps.cli.test]
directories = ["."]

[apps.cli.check]
[apps.cli.check.lint]
ignore = ["no-print"]



[apps.desktop]
kind = "desktop"
entry-point = "desktop.main"

[apps.desktop.desktop]
name = "jaclang"
identifier = "org.jaclang.desktop"
backend = "https://jaclang.org"

[apps.desktop.desktop.window]
title = "jaclang.org"
width = 1280
height = 860
min_width = 900
min_height = 600



[apps.social_graph]
kind = "service"
entry-point = "core.social_graph"

[apps.scoring]
kind = "service"
entry-point = "core.scoring_service"


[precommit]
typecheck = true

[serve]
[serve.auth]
registration_challenge = true
registration_attempts_per_hour = 5
registration_challenges_per_10_minutes = 20


[test]
directories = ["core", "web", "mobile", "cli"]

[check]
[check.lint]
select = ["all", "strip-comments", "strip-docstrings"]
exclude = [".jac/*", "core/site/examples/*", "core/site/source/FloatingSource.jac", "core/site/landing/Reveal.jac", "core/site/game/webgl_host.jac", "core/async_utils.jac", "core/leaderboard/format.jac"]


[memory]
profile = "managed"
enforce = ["arena*", "sim*", "gmath*", "platform_rl*"]

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "orange"
font = "geist"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
components_dir = "core/site/ui"
utils_path = "core/utils.jac"

[dependencies]
[dependencies.npm]
"@noble/hashes" = "^2.0.1"
react-native-web = "^0.19.13"
embla-carousel-react = "*"
"@hugeicons/core-free-icons" = "*"
"@hugeicons/react" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/geist" = "*"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/geist-mono" = "latest"
motion = "latest"
mermaid = "^11"
lucide-react = "^0.469.0"


[byllm]
[byllm.model]
default_model = "anthropic/claude-sonnet-5"


[client]
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.assets]
dir = "core/site/assets"
custom_extensions = [".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".ico", ".woff", ".woff2", ".ttf", ".otf", ".eot", ".mp4", ".webm", ".mp3", ".wav", ".css", ".js", ".json"]

[client.app_meta_data]
title = "The Jac Programming Language"
description = "One language, one compiler, the whole stack. No glue. AI, graphs, persistence, APIs, UIs, and cloud deployment as language features."
keywords = "jac, jaclang, programming language, jaseci, object-spatial programming, by llm, full-stack"
author = "Jaseci Labs"
theme_color = "#ff6b35"
icon = "/static/assets/jac-logo.svg"
og_title = "The Jac Programming Language"
og_description = "One language, one compiler, the whole stack. No glue. AI, graphs, persistence, APIs, UIs, and cloud deployment as language features."
og_type = "website"
og_url = "https://jaclang.org/"
og_site_name = "jaclang.org"
og_image = "https://jaclang.org/static/assets/og-card.png"
twitter_card = "summary_large_image"
twitter_image = "https://jaclang.org/static/assets/og-card.png"
